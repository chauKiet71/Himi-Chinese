name: Deploy production VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  VPS_HOST: 160.30.159.52
  VPS_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: |
          set -Eeuo pipefail
          npm run build

          audio_dir="$(realpath dist/client/audio)"
          if [[ "$audio_dir" != "$GITHUB_WORKSPACE/dist/client/audio" ]] || [[ ! -d public/audio ]]; then
            echo "Refusing to remove an unexpected audio output path: $audio_dir" >&2
            exit 1
          fi
          rm -rf -- "$audio_dir"

          test -f dist/server/wrangler.json
          test -f node_modules/wrangler/bin/wrangler.js

          release_archive="$RUNNER_TEMP/hanziwork-${GITHUB_SHA}.tar.gz"
          tar -czf "$release_archive" \
            dist \
            node_modules \
            scripts \
            lib \
            db \
            drizzle \
            package.json \
            package-lock.json
          sha256sum "$release_archive"

      - name: Configure pinned SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/hanziwork-vps
          chmod 600 ~/.ssh/hanziwork-vps
          printf '%s\n' '160.30.159.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINZMT7YHsS5qRX/ciXTbLxKZVCgpJS7m/L9Nwgr3RNZS' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer release artifact
        run: |
          set -Eeuo pipefail
          release_archive="$RUNNER_TEMP/hanziwork-${GITHUB_SHA}.tar.gz"
          remote_archive="/tmp/hanziwork-${GITHUB_SHA}.tar.gz"
          scp \
            -i ~/.ssh/hanziwork-vps \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$release_archive" \
            "$VPS_USER@$VPS_HOST:$remote_archive"

      - name: Deploy artifact and verify
        run: |
          set -Eeuo pipefail
          release_archive="$RUNNER_TEMP/hanziwork-${GITHUB_SHA}.tar.gz"
          remote_archive="/tmp/hanziwork-${GITHUB_SHA}.tar.gz"
          release_checksum="$(sha256sum "$release_archive" | awk '{print $1}')"

          ssh \
            -i ~/.ssh/hanziwork-vps \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$remote_archive" "$GITHUB_SHA" "$release_checksum" <<'REMOTE'
          set -Eeuo pipefail

          archive_path="$1"
          release_id="$2"
          expected_checksum="$3"
          printf '%s  %s\n' "$expected_checksum" "$archive_path" | sha256sum --check --status

          deploy_script="$(mktemp /tmp/hanziwork-deploy.XXXXXX)"
          trap 'rm -f -- "$deploy_script"' EXIT
          tar -xOzf "$archive_path" scripts/deploy-vps.sh > "$deploy_script"
          chmod 700 "$deploy_script"
          bash "$deploy_script" "$archive_path" "$release_id"
          REMOTE
